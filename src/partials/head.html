<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>{{ head_title }}</title>
<meta name="description" content="{{ page_desc }}">

<meta property="og:title" content="{{ og_title }}">
<meta property="og:description" content="{{ page_desc }}">
<meta property="og:type" content="website">
<meta property="og:url" content="{{ url }}/{{ page_file }}">
<meta property="og:image" content="{{ url }}/assets/img/{{ photo }}">
<meta name="twitter:card" content="summary">
<meta name="twitter:title" content="{{ og_title }}">
<meta name="twitter:description" content="{{ page_desc }}">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Sans:ital,opsz,wght@0,9..40,400;0,9..40,500;0,9..40,600;0,9..40,700;1,9..40,400&amp;family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,700;0,8..60,800;1,8..60,400&amp;family=JetBrains+Mono:wght@400&amp;display=swap" rel="stylesheet">

<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.7.2/css/all.min.css" integrity="sha512-Evv84Mr4kqVGRNSgIGL/F/aIDqQb7xQ2vcrdIwxfjThSH8CSR7PBEakCr51Ck+w+/U6swU2Im1vVX0SVk9ABhg==" crossorigin="anonymous" referrerpolicy="no-referrer">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/jpswalsh/academicons@1/css/academicons.min.css">

<link rel="stylesheet" href="assets/css/main.css?v={{ asset_v }}">
<link rel="icon" href="favicon.svg" type="image/svg+xml">

<style>:root { --accent: {{ accent }}; --accent-hover: {{ accent_hover }}; }</style>

<!-- light-first: honor an explicit dark choice, otherwise stay light -->
<script>(function(){try{var t=localStorage.getItem('theme');if(t==='dark')document.documentElement.setAttribute('data-bs-theme','dark');}catch(e){}})();</script>
<noscript><style>.fade-in-section{opacity:1;transform:none}</style></noscript>

<script type="application/ld+json">
{
  "@context": "https://schema.org",
  "@type": "ResearchOrganization",
  "name": "{{ name }}",
  "description": "{{ title }}",
  "parentOrganization": { "@type": "Organization", "name": "{{ institution }}" },
  "url": "{{ url }}",
  "email": "mailto:{{ email }}"{{ jsonld_sameas }}
}
</script>
</head>
